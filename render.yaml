# Render Blueprint — PHP API (backend/) with Supabase PostgreSQL.
# Connect this repo in Render and the service below is created automatically.
services:
  - type: web
    name: payroll-api
    env: php
    plan: free
    rootDir: backend
    region: singapore          # nearest Render region to the Mumbai (ap-south-1) Supabase pooler
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php -S 0.0.0.0:$PORT -t public
    healthCheckPath: /api/health
    envVars:
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true    # JWT signing secret — Render creates a random one on first deploy
      - key: FRONTEND_ORIGIN
        sync: false            # set to your Vercel URL, e.g. https://payroll.vercel.app
      - key: REGISTRATION_CODE
        sync: false            # gate code for the Register page (leave unset to disable self-registration)
      - key: SUPABASE_DB_HOST
        sync: false            # e.g. aws-0-ap-south-1.pooler.supabase.com
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USER
        sync: false            # e.g. postgres.<project-ref>
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_SSLMODE
        value: require
      - key: SUPABASE_URL
        sync: false            # optional: https://<ref>.supabase.co (health + storage)
      - key: SUPABASE_JWT_SECRET
        sync: false            # optional: only if you also accept Supabase-issued JWTs
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # optional: payslip PDF uploads to Storage
      - key: MAIL_WEBHOOK_URL
        sync: false            # optional: mail relay (e.g. Supabase Edge Function + Resend) for payslip emails
