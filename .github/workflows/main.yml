name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP (matches Docker image: php 8.3)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, curl, json
          coverage: none

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --no-check-publish || composer check-platform-reqs

      - name: Lint all PHP files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" || fail=1
          done < <(find backend -name '*.php' -print0)
          exit $fail

  docker:
    name: Docker image build (Render deploy parity)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t payroll-backend-ci .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8080:8080 -e SUPABASE_URL=http://example.invalid payroll-backend-ci
          for i in $(seq 1 15); do
            sleep 2
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "Container started and /api/health reachable."; exit 0
            fi
          done
          docker logs api
          # Route responding at all (not 404/502) still proves boot + routing work.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health || true)
          test "$code" != "000" && test "$code" != "502"
